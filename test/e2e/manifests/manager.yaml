# In-cluster manager manifests for the k3d e2e suite. Deliberately does NOT
# restate the manager's RBAC policy rules — config/rbac/role.yaml is applied
# separately so controller-gen RBAC marker changes propagate automatically.
# Only the Deployment shell is duplicated here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dingo-operator
  namespace: dingo-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dingo-operator-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dingo-operator-manager-role
subjects:
  - kind: ServiceAccount
    name: dingo-operator
    namespace: dingo-operator-system
---
# Deliberately no cluster-wide Secret grant here.
#
# The operator's own kubebuilder markers grant no Secret access at all — the
# deployment supplies it, and the Helm chart makes that supply configurable:
# per-namespace Role+RoleBinding when rbac.keySecretsNamespaces is set,
# cluster-wide ClusterRole otherwise. The two are mutually exclusive.
#
# This suite runs the *narrow* one. Namespaced access is a strict subset of
# cluster-wide, so proving the operator works with only a per-namespace
# secrets:get proves it works with the broad grant too — the reverse is not
# true. The Role and RoleBinding are created per test namespace by the harness
# (createKeysReaderRBAC), because the namespace name is random per run.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dingo-operator
  namespace: dingo-operator-system
spec:
  replicas: 1
  selector:
    # Immutable, and deliberately narrower than the pod labels below: it must
    # stay exactly `app: dingo-operator`. Adding the node-to-client label here
    # would make the Deployment unpatchable in place.
    matchLabels: { app: dingo-operator }
  template:
    metadata:
      labels:
        app: dingo-operator
        # Opts the operator's pod into a managed block producer's
        # node-to-client port, which is how it reads the authoritative on-chain
        # opcert counter (internal/onchain). The rule the operator renders
        # (internal/resources/policy.go, nodeToClientIngress) admits a pod from
        # another namespace only when the *namespace* carries the same label
        # too — the two selectors are ANDed — and the operator always runs in
        # dingo-operator-system while workloads run in per-test e2e-*
        # namespaces. hack/e2e/k3d-up.sh labels the namespace; without both
        # halves k3s drops the dial and the feature degrades silently to
        # OnChainCounterAvailable=False/QueryFailed.
        #
        # The shipped Helm chart (helm-charts, charts/dingo-operator) must set
        # the same pair; this manifest is the e2e suite's stand-in for it.
        dingo.blinklabs.io/node-to-client: allowed
    spec:
      serviceAccountName: dingo-operator
      containers:
        - name: manager
          image: dingo-operator:latest
          imagePullPolicy: Never
          args: ["--leader-elect=false"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # Matches the Helm chart's securityContext.readOnlyRootFilesystem
            # default. Without it the suite would run a laxer container than
            # the one we ship, and could not catch a change that only fails
            # under a read-only root filesystem.
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
