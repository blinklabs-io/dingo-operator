apiVersion: dingo.blinklabs.io/v1alpha1
kind: DingoNode
metadata:
  name: relay
  namespace: cardano
spec:
  role: relay
  network: mainnet
  replicas: 2
  storageMode: core
  persistence:
    size: 120Gi
  mithril:
    enabled: true
  metrics:
    podMonitor:
      enabled: true
  logging:
    format: json
  # Tracing needs a Dingo image of v0.82.0 or later (the default qualifies).
  # tracing:
  #   enabled: true
  #   endpoint: http://otel-collector.observability:4318
  #   sampleRatio: "0.1"
  topology:
    # Relays peer with the block producer and any external relays. Each entry
    # becomes its own localRoots group (one Genesis witness each).
    relayRefs:
      - producer
    externalRelays:
      - address: relay1.example.com
        port: 3001
        valency: 1
        trustable: true
