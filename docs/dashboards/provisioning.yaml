apiVersion: 1

providers:
  - name: dingo-operator
    orgId: 1
    folder: Dingo Operator
    folderUid: dingo-operator-dashboards
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/dingo-operator
      foldersFromFilesStructure: false
