name: envtest

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: envtest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  envtest:
    name: envtest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Run tests with envtest control plane
        # `make test-envtest` pins the control-plane version and exports
        # KUBEBUILDER_ASSETS. The controller suite self-skips when that is
        # unset, so fail the job if any test was skipped for that reason.
        run: |
          make test-envtest | tee envtest.log
          ! grep -q 'KUBEBUILDER_ASSETS not set' envtest.log
