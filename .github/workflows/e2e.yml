name: e2e

on:
  pull_request:
    paths:
      - 'api/**'
      - 'internal/**'
      - 'cmd/**'
      - 'config/**'
      - 'test/e2e/**'
      - 'hack/e2e/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'Makefile'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    strategy:
      matrix:
        go-version: [1.26.x]
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    # Must clear the Makefile's `go test -timeout 45m` plus the image
    # build, k3d bring-up, teardown and diagnostics collection (~5m). See
    # the deadline-budget comment in test/e2e/harness_test.go.
    timeout-minutes: 55
    # `make e2e`'s trailer always runs hack/e2e/k3d-down.sh after `go test`,
    # success or failure, which deletes the cluster and the e2e kubeconfig.
    # Without this, the "Collect diagnostics" step below would run against
    # an already-torn-down cluster on every failure. E2E_SKIP_TEARDOWN (not
    # E2E_KEEP_UP — that one is also read by the Go harness and would leave
    # every test's namespace live for the whole run, which matters once
    # Task 9 adds more tests to the same suite) leaves only the cluster and
    # kubeconfig up; `go test` still deletes its own e2e-* namespaces
    # normally. See hack/e2e/k3d-down.sh for the full rationale. The runner
    # VM is destroyed at the end of the job regardless, so leaving the
    # cluster up here costs nothing.
    env:
      E2E_SKIP_TEARDOWN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/v5.7.4/install.sh \
            | TAG=v5.7.4 bash
          k3d version
      - name: Run e2e
        run: make e2e
      - name: Collect diagnostics
        if: failure()
        run: ./hack/e2e/collect-diagnostics.sh
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 https://github.com/actions/upload-artifact/releases/tag/v7.0.1
        with:
          name: e2e-diagnostics
          path: /tmp/e2e-diagnostics
          retention-days: 7
